[project]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Matthew Martin", email = "matthewdeanmartin@gmail.com"}]
requires-python = ">=3.9"
name = "pycodetags-chat"
version = "0.2.0"
description = "Discussion code-tag schema for pycodetags"
dependencies = ["pycodetags>=0.8.0,<0.9", "pluggy"]

[project.entry-points."pycodetags"] # This is the crucial part for pluggy
# The key "markdown_view" is the name of the plugin (can be anything unique)
# The value "code_tags_markdown_view" is the module where pluggy should look for @hookimpls
pycodetags_chat = "pycodetags_chat.main:chat_app_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"