name: Create Draft Release

concurrency: changelog

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      component:
        description: Component to draft
        type: choice
        default: default
        options: [default, pycodetags-issue-tracker]
      version:
        description: Optional version override; otherwise infer from this component's changelog
        type: string
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Update draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component || 'default' }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          args=()
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          uv run --frozen kaclm --component "$COMPONENT" github-release --repository "$REPOSITORY" "${args[@]}"
