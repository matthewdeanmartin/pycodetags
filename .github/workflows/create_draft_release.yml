name: Create Draft Release

concurrency: changelog

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      component:
        description: Component to draft
        type: choice
        default: default
        options: [default, pycodetags-issue-tracker]
      version:
        description: Optional version override; otherwise infer from this component's changelog
        type: string
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Update draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component || 'default' }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          args=()
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          uv run --frozen kaclm --component "$COMPONENT" github-release --repository "$REPOSITORY" "${args[@]}"
