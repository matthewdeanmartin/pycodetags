name: Publish functional plugin
on:
  workflow_dispatch:
    inputs:
      project:
        type: choice
        required: true
        options: [pycodetags_issue_tracker, pycodetags_chat, pycodetags_universal]
permissions:
  contents: read
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Require a committed release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: test "$REF_TYPE" = tag
  checks:
    needs: tag
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ github.ref_name }}
      release_project: ${{ inputs.project }}
  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-candidates-linux
          path: artifacts/
      - name: Publish the exact tested plugin artifacts
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: artifacts/${{ inputs.project }}/
