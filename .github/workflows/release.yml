name: Release
concurrency: changelog
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag (v0.8.2 or pycodetags-issue-tracker-v0.4.0)
        required: true
        type: string
permissions:
  contents: read
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      branch: ${{ steps.release.outputs.branch }}
      component: ${{ steps.release.outputs.component }}
      project: ${{ steps.release.outputs.project }}
      package: ${{ steps.release.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --frozen --group dev
      - name: Verify component release isolation
        run: uv run --frozen pytest tests/test_monorepo_releases.py -q
      - name: Prepare release branch
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) COMPONENT=default; PROJECT=core; PACKAGE=pycodetags ;;
            pycodetags-issue-tracker-v[0-9]*)
              COMPONENT=pycodetags-issue-tracker
              PROJECT=pycodetags_issue_tracker
              PACKAGE=pycodetags-issue-tracker ;;
            *) echo "Unsupported release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          gh api "repos/$REPO/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          RELEASE_ID=$(python -c "import json,os; print(json.load(open(os.environ['RUNNER_TEMP'] + '/release.json'))['id'])")
          uv run --frozen kaclm --component "$COMPONENT" --json release-bump \
            --version "$RELEASE_TAG" \
            --base "$BASE_BRANCH" \
            --release-id "$RELEASE_ID" \
            --repository "$REPO" \
            --yes > "$RUNNER_TEMP/release-bump.json"
          python -c 'import json,os; result=json.load(open(os.environ["RUNNER_TEMP"] + "/release-bump.json")); print("sha=" + result["commit_sha"])' >> "$GITHUB_OUTPUT"
          python -c 'import json,os; result=json.load(open(os.environ["RUNNER_TEMP"] + "/release-bump.json")); print("branch=" + result["branch"])' >> "$GITHUB_OUTPUT"
          echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
  build:
    needs: bump
    uses: ./.github/workflows/build.yml
    with:
      source_ref: ${{ needs.bump.outputs.sha }}
  publish:
    needs: [bump, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.bump.outputs.package }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidates-linux
          path: artifacts/
      - name: Publish the selected package artifacts
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: artifacts/${{ needs.bump.outputs.project }}/
  merge_request:
    name: Open release PR after publication
    needs: [bump, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --frozen --group dev
      - name: Open or update release PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPONENT: ${{ needs.bump.outputs.component }}
          RELEASE_BRANCH: ${{ needs.bump.outputs.branch }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          uv run --frozen kaclm --component "$COMPONENT" github-pr \
            --repository "$REPO" \
            --head "$RELEASE_BRANCH" \
            --base "$BASE_BRANCH" \
            --title "chore: release $RELEASE_TAG" \
            --body "Published $RELEASE_TAG to PyPI. Merge the version and changelog updates used to build the published artifacts."
